<!doctype html>
<html>
  <head><meta charset='utf-8'><title>{{ student.name }}</title>
  <link rel='stylesheet' href='/static/style.css'></head>
  <body>
    <a href='/students'>Back to Students</a>
    <h1>{{ student.name }}</h1>
    <p>Email: {{ student.email }}</p>
    <h3>My Events</h3>
    <ul>
    {% for e in events %}
      <li>{{ e.title }} - {{ e.date_time }}</li>
    {% endfor %}
    </ul>
  </body>
</html>
