<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Event</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="navbar">
    <h2>Student Club Events</h2>
    <div>
        <a href="/events">Events</a>

        {% if session.get('role') == 'admin' %}
            <a href="/students">Students</a>
        {% else %}
            <a href="/students/{{ session.get('user_id') }}">Profile</a>
        {% endif %}

        <a href="/logout">Logout</a>
    </div>
</div>

<div class="card" style="max-width:600px; margin:auto;">
    <h2>Add New Event</h2>

    <form method="post">
        <input type="text" name="title" placeholder="Event Title" required>
        <input type="text" name="description" placeholder="Event Description" required>
        <input type="text" name="date_time" placeholder="Date & Time (e.g. 2025-10-01 10:00)" required>
        <input type="text" name="location" placeholder="Location" required>
        <input type="number" name="capacity" placeholder="Capacity" required>

        <button class="btn">Add Event</button>
    </form>
</div>

</body>
</html>
