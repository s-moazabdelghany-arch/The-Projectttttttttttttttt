<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Students</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="navbar">
    <h2>Student Club Events</h2>
    <div>
        <a href="/events">Events</a>

        {% if session.get('role') == 'admin' %}
            <a href="/students">Students</a>
        {% else %}
            <a href="/students/{{ session.get('user_id') }}">Profile</a>
        {% endif %}

        <a href="/logout">Logout</a>
    </div>
</div>

<h1>All Students</h1>

<div class="cards">
    {% for s in students %}
    <div class="card">
        <h3>{{ s.name }}</h3>
        <p>{{ s.email }}</p>
        <a class="btn" href="/students/{{ s.id }}">View Profile</a>
    </div>
    {% endfor %}
</div>

</body>
</html>
